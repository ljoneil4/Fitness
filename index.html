<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Liam — Winter Lifting Block</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #0D1B2A;
  color: #F0F4F8;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 90px;
}

/* ── HEADER ── */
.hdr {
  background: #1C2E40;
  border-bottom: 1px solid #2A4057;
  padding: 12px 14px 10px;
  position: sticky; top: 0; z-index: 100;
}
.hdr-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.athlete { font-size: 13px; font-weight: 700; color: #00C2A8; }
.block-lbl { font-size: 11px; color: #7A9BB0; }
.date-lbl { font-size: 11px; color: #4A6070; text-align: right; }

.week-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.nav-btn {
  background: #243B52; border: 1px solid #2A4057; color: #F0F4F8;
  width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
  font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.week-info { flex: 1; text-align: center; }
.week-title { font-size: 15px; font-weight: 700; }
.week-dates { font-size: 11px; color: #7A9BB0; }

.day-tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  background: none; border: 1px solid #2A4057; color: #7A9BB0;
  padding: 5px 10px; border-radius: 20px; cursor: pointer;
  font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
}
.day-tab.active { background: #00C2A8; border-color: #00C2A8; color: #0D1B2A; font-weight: 800; }
.day-tab.done { border-color: #007A6A; color: #00C2A8; }
.day-tab.done::after { content: ' ✓'; }

/* ── MAIN ── */
.main { padding: 12px 12px 0; max-width: 560px; margin: 0 auto; }

/* ── SESSION HEADER ── */
.sess-hdr {
  background: #1C2E40; border-radius: 10px; padding: 13px; margin-bottom: 10px;
  border-left: 3px solid #00C2A8;
}
.sess-title { font-size: 16px; font-weight: 800; margin-bottom: 3px; }
.sess-meta { font-size: 12px; color: #7A9BB0; margin-bottom: 6px; }
.sess-goal { font-size: 12px; background: #243B52; border-radius: 6px; padding: 7px 10px; }

/* ── CHECKPOINT BANNER ── */
.cp-banner {
  background: linear-gradient(135deg, rgba(255,209,102,0.12), rgba(0,194,168,0.08));
  border: 1.5px solid #FFD166;
  border-radius: 12px; padding: 13px 15px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
  position: relative; overflow: hidden;
}
.cp-icon { font-size: 24px; }
.cp-title { font-size: 14px; color: #FFD166; font-weight: 800; letter-spacing: 0.2px; }
.cp-sub { font-size: 11px; color: #C9D4DE; margin-top: 2px; }
.cp-tag { font-size: 9px; font-weight: 800; color: #0D1B2A; background: #FFD166; padding: 2px 7px; border-radius: 8px; letter-spacing: 0.4px; text-transform: uppercase; position: absolute; top: 10px; right: 12px; }

/* ── DAY COMPLETE CELEBRATION ── */
.day-complete-banner {
  background: linear-gradient(135deg, rgba(0,194,168,0.15), rgba(74,158,255,0.08));
  border: 1px solid #00C2A8; border-radius: 12px;
  padding: 14px 15px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
  animation: celebrate-in 0.4s ease;
}
@keyframes celebrate-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.day-complete-icon { font-size: 26px; }
.day-complete-title { font-size: 14px; font-weight: 800; color: #00C2A8; }
.day-complete-sub { font-size: 11px; color: #7A9BB0; margin-top: 2px; }

/* ── RECOVERY BANNER ── */
.rec-banner {
  background: rgba(122,155,176,0.08); border: 1px solid #4A6070;
  border-radius: 10px; padding: 10px 13px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}

/* ── WEEK OVERVIEW ── */
.overview { background: #1C2E40; border-radius: 10px; padding: 13px; margin-bottom: 10px; }
.overview-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.overview-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; border-bottom: 1px solid #2A4057; cursor: pointer;
}
.overview-row:last-child { border-bottom: none; }
.ov-day { font-size: 13px; font-weight: 600; }
.ov-focus { font-size: 11px; color: #7A9BB0; }
.ov-status { font-size: 14px; }
.ov-day-row.today .ov-day::before { content: '● '; color: #00C2A8; font-size: 10px; }

/* ── DASHBOARD (new overview top section) ── */
.dash-card {
  background: linear-gradient(135deg, #1C2E40 0%, #17293b 100%);
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
  border: 1px solid #2A4057;
}
.dash-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.dash-row:last-child { margin-bottom: 0; }
.dash-block-progress { flex: 1; }
.dash-label { font-size: 11px; color: #7A9BB0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.dash-value { font-size: 18px; font-weight: 800; color: #F0F4F8; }
.block-bar-track { background: #0D1B2A; border-radius: 8px; height: 8px; margin-top: 8px; overflow: hidden; }
.block-bar-fill { background: linear-gradient(90deg, #00C2A8, #4A9EFF); height: 100%; border-radius: 8px; transition: width 0.4s ease; }

.dash-split { display: flex; gap: 12px; }
.dash-mini { flex: 1; background: #0D1B2A; border-radius: 10px; padding: 12px; text-align: center; }
.dash-mini-label { font-size: 10px; color: #7A9BB0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
.dash-ring-wrap { position: relative; width: 56px; height: 56px; margin: 0 auto 4px; }
.dash-ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #F0F4F8; }
.dash-mini-sub { font-size: 10px; color: #4A6070; }
.cp-countdown-num { font-size: 24px; font-weight: 900; color: #FFD166; line-height: 1; }
.cp-countdown-label { font-size: 10px; color: #7A9BB0; margin-top: 4px; }

/* ── DAY ROW REBUILT ── */
.ov-day-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid #2A4057; cursor: pointer;
}
.ov-day-row:last-child { border-bottom: none; }
.ov-day-icon {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  background: #243B52; border: 1px solid #2A4057;
}
.ov-day-icon.complete { background: rgba(0,194,168,0.15); border-color: #00C2A8; color: #00C2A8; }
.ov-day-info { flex: 1; min-width: 0; }
.ov-day-name { font-size: 13px; font-weight: 700; }
.ov-day-focus2 { font-size: 11px; color: #7A9BB0; }
.ov-day-chevron { color: #4A6070; font-size: 14px; }

/* ── BLOCK ── */
.block { margin-bottom: 10px; }
.block-hdr { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.block-tag {
  background: #243B52; border: 1px solid #2A4057; color: #7A9BB0;
  font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 10px; letter-spacing: 0.4px;
}
.block-name { font-size: 12px; color: #7A9BB0; }

/* ── WARMUP STRIP ── */
.warmup-strip {
  background: #1C2E40; border: 1px solid #2A4057; border-radius: 6px;
  padding: 8px 11px; margin-bottom: 8px; font-size: 12px; color: #7A9BB0;
}
.warmup-strip strong { color: #F0F4F8; font-size: 11px; margin-right: 5px; }

/* ── EXERCISE CARD ── */
.ex-card {
  background: #1C2E40; border: 1px solid #2A4057; border-radius: 10px;
  margin-bottom: 8px; overflow: hidden;
}
.ex-card.marker { border-color: #FFD166; }
.ex-top { padding: 11px 13px 8px; }
.ex-name-row { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; flex-wrap: wrap; }
.ex-name { font-size: 14px; font-weight: 800; }
.badge-marker { background: #FFD166; color: #0D1B2A; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 10px; }
.badge-compound { background: #007A6A; color: #00C2A8; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 10px; }
.ex-presc { font-size: 11px; color: #7A9BB0; margin-bottom: 5px; }
.form-btn { background: none; border: none; color: #00C2A8; font-size: 11px; cursor: pointer; padding: 0; }
.form-notes { background: #0D1B2A; border-radius: 6px; padding: 9px 11px; margin: 0 13px 10px; font-size: 11px; color: #7A9BB0; line-height: 1.6; display: none; }
.form-notes.open { display: block; }
.form-notes li { margin-left: 13px; margin-bottom: 2px; }
.prog-note { background: #0D1B2A; border-left: 2px solid #007A6A; border-radius: 0 6px 6px 0; padding: 5px 11px; margin: 0 13px 10px; font-size: 10px; color: #7A9BB0; }

/* ── SETS ── */
.sets-area { padding: 0 13px 6px; }
.sets-hdr { display: grid; grid-template-columns: 34px 1fr 1fr 1fr; gap: 4px; margin-bottom: 5px; font-size: 10px; color: #4A6070; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.set-row { display: grid; grid-template-columns: 34px 1fr 1fr 1fr; gap: 4px; margin-bottom: 5px; align-items: center; border-radius: 6px; padding: 2px 0; }
.set-row.active { background: rgba(0,194,168,0.07); }
.set-row.done { opacity: 0.55; }
.set-num { font-size: 12px; font-weight: 700; color: #7A9BB0; text-align: center; }
.set-input {
  background: #243B52; border: 1px solid #2A4057; border-radius: 6px;
  color: #F0F4F8; font-size: 16px; font-weight: 700; padding: 7px 5px;
  text-align: center; width: 100%;
}
.set-input:focus { outline: none; border-color: #00C2A8; }
.set-target { font-size: 10px; color: #4A6070; text-align: center; }

/* ── DONE BTN ── */
.done-btn {
  margin: 4px 13px 10px; width: calc(100% - 26px); display: block;
  background: #00C2A8; border: none; color: #0D1B2A;
  font-size: 13px; font-weight: 800; padding: 9px; border-radius: 6px; cursor: pointer;
}
.done-btn.all-done { background: #007A6A; color: #00C2A8; }

/* ── SUPERSET ── */
.superset-wrap { border: 1px solid #F4A261; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.superset-hdr { background: rgba(244,162,97,0.1); padding: 6px 13px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(244,162,97,0.25); }
.superset-lbl { font-size: 10px; font-weight: 800; color: #F4A261; letter-spacing: 0.4px; }
.superset-rest { font-size: 10px; color: #7A9BB0; margin-left: auto; }
.superset-ex { border-bottom: 1px solid rgba(244,162,97,0.15); }
.superset-ex:last-child { border-bottom: none; }
.superset-arrow { text-align: center; padding: 4px; font-size: 13px; color: #F4A261; background: rgba(244,162,97,0.05); border-top: 1px dashed rgba(244,162,97,0.25); border-bottom: 1px dashed rgba(244,162,97,0.25); font-weight: 700; }
.superset-ftr { background: rgba(244,162,97,0.07); padding: 7px 13px; font-size: 11px; color: #F4A261; font-weight: 600; text-align: center; }

/* ── RUN CARD ── */
.run-card { background: #1C2E40; border: 1px solid #2A4057; border-left: 3px solid #4A9EFF; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.run-top { padding: 11px 13px 8px; }
.run-badge { background: rgba(74,158,255,0.15); color: #4A9EFF; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 10px; margin-right: 6px; }
.run-title { font-size: 13px; font-weight: 700; }
.run-presc { font-size: 13px; color: #F0F4F8; background: rgba(74,158,255,0.07); border-left: 2px solid #4A9EFF; border-radius: 0 6px 6px 0; padding: 8px 11px; margin: 0 13px 10px; line-height: 1.5; }
.run-fields { padding: 0 13px 10px; display: flex; flex-direction: column; gap: 8px; }
.run-field-row { display: flex; align-items: center; gap: 10px; }
.run-field-lbl { font-size: 12px; color: #7A9BB0; font-weight: 600; min-width: 60px; }
.run-input { background: #243B52; border: 1px solid #2A4057; border-radius: 6px; color: #F0F4F8; font-size: 16px; font-weight: 700; padding: 7px 10px; width: 90px; text-align: center; }
.run-input:focus { outline: none; border-color: #4A9EFF; }
.run-unit { font-size: 12px; color: #7A9BB0; }
.run-done-btn {
  margin: 0 13px 10px; width: calc(100% - 26px); display: block;
  background: rgba(74,158,255,0.15); border: 1px solid rgba(74,158,255,0.4);
  color: #4A9EFF; font-size: 13px; font-weight: 700; padding: 9px; border-radius: 6px; cursor: pointer;
}
.run-done-btn.complete { background: rgba(74,158,255,0.07); color: #4A6070; border-color: #2A4057; }

/* ── NOTES ── */
.notes-section { background: #1C2E40; border-radius: 10px; padding: 13px; margin-bottom: 10px; border: 1px solid #2A4057; }
.notes-lbl { font-size: 11px; font-weight: 700; color: #7A9BB0; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.5px; }
.notes-input { background: #0D1B2A; border: 1px solid #2A4057; border-radius: 6px; color: #F0F4F8; font-size: 16px; padding: 9px 11px; width: 100%; min-height: 70px; resize: vertical; font-family: inherit; line-height: 1.5; }
.notes-input:focus { outline: none; border-color: #00C2A8; }
.notes-input::placeholder { color: #4A6070; }

/* ── SAVE CONFIRM ── */
.save-bar { text-align: center; font-size: 12px; color: #00C2A8; padding: 6px; min-height: 28px; }

/* ── PROGRESS ── */
.progress-section { background: #1C2E40; border-radius: 10px; padding: 13px; margin-bottom: 10px; border: 1px solid #2A4057; }
.progress-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.prog-mov { margin-bottom: 18px; }
.prog-mov:last-child { margin-bottom: 0; }
.prog-mov-hdr { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.prog-mov-name { font-size: 12px; font-weight: 700; color: #FFD166; }
.prog-mov-trend { font-size: 11px; font-weight: 700; }
.prog-mov-trend.up { color: #00C2A8; }
.prog-mov-trend.flat { color: #7A9BB0; }
.prog-bars { display: flex; align-items: flex-end; gap: 4px; height: 54px; margin-bottom: 6px; }
.prog-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.prog-bar { width: 100%; background: linear-gradient(180deg, #00C2A8, #007A6A); border-radius: 4px 4px 0 0; min-height: 3px; transition: height 0.3s ease; }
.prog-bar.best { background: linear-gradient(180deg, #FFD166, #d4a83e); }
.prog-bar-val { font-size: 9px; color: #7A9BB0; font-weight: 700; margin-top: 3px; white-space: nowrap; }
.prog-bar-wk { font-size: 8px; color: #4A6070; margin-top: 1px; }
.prog-empty { font-size: 12px; color: #4A6070; padding: 8px 0; }

/* ── VIEW TOGGLE ── */
.view-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
.view-btn { flex: 1; background: #1C2E40; border: 1px solid #2A4057; color: #7A9BB0; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; }
.view-btn.active { background: #243B52; border-color: #00C2A8; color: #F0F4F8; }

/* ── EXPORT ── */
.export-btn { width: 100%; background: #1C2E40; border: 1px solid #2A4057; color: #7A9BB0; font-size: 13px; font-weight: 600; padding: 10px; border-radius: 10px; cursor: pointer; margin-bottom: 10px; }
.export-output { background: #0D1B2A; border: 1px solid #007A6A; border-radius: 10px; padding: 13px; margin-bottom: 10px; font-size: 11px; color: #7A9BB0; font-family: monospace; white-space: pre-wrap; line-height: 1.6; max-height: 350px; overflow-y: auto; }
.copy-btn { width: 100%; background: #00C2A8; border: none; color: #0D1B2A; font-size: 14px; font-weight: 800; padding: 12px; border-radius: 10px; cursor: pointer; margin-bottom: 10px; }

.reset-btn {
  width: 100%; background: none; border: 1px solid #2A4057;
  color: #4A6070; font-size: 12px; font-weight: 600;
  padding: 8px; border-radius: 6px; cursor: pointer;
  margin-bottom: 12px; text-align: center;
}
.reset-btn.confirming { border-color: #E76F51; color: #E76F51; }

/* ── FLOAT TIMER ── */
.float-timer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: #1C2E40; border-top: 1px solid #2A4057;
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  transition: transform 0.2s ease;
}
.float-timer.hidden { transform: translateY(100%); pointer-events: none; }
.timer-lbl { font-size: 11px; color: #7A9BB0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
.timer-presets { display: flex; gap: 5px; }
.t-btn { background: #243B52; border: 1px solid #2A4057; color: #F0F4F8; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
.t-btn.on { border-color: #00C2A8; background: #007A6A; color: #00C2A8; }
.t-stop { background: none; border: 1px solid #2A4057; color: #7A9BB0; font-size: 11px; padding: 4px 7px; border-radius: 6px; cursor: pointer; margin-left: 6px; }
.timer-disp { font-size: 30px; font-weight: 900; color: #7A9BB0; font-variant-numeric: tabular-nums; min-width: 68px; text-align: right; letter-spacing: -1px; }
.timer-disp.run { color: #00C2A8; }
.timer-disp.warn { color: #F4A261; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div><div class="athlete">Liam O'Neil</div><div class="block-lbl">Winter Lifting Block · Nov 2026 → Jan 2027</div></div>
    <div class="date-lbl" id="dateLabel"></div>
  </div>
  <div class="week-nav">
    <button class="nav-btn" id="prevBtn" onclick="changeWeek(-1)">‹</button>
    <div class="week-info"><div class="week-title" id="weekTitle"></div><div class="week-dates" id="weekDates"></div></div>
    <button class="nav-btn" id="nextBtn" onclick="changeWeek(1)">›</button>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
</div>

<div class="main" id="main"></div>

<div class="float-timer">
  <div>
    <div class="timer-lbl">Rest Timer</div>
    <div class="timer-presets">
      <button class="t-btn" id="t90" onclick="startTimer(90)">90s</button>
      <button class="t-btn" id="t120" onclick="startTimer(120)">2 min</button>
      <button class="t-btn" id="t150" onclick="startTimer(150)">2:30</button>
      <button class="t-stop" onclick="stopTimer()">✕</button>
    </div>
  </div>
  <div class="timer-disp" id="timerDisp">—</div>
</div>

<script>
// ── STORAGE ──────────────────────────────────────────────────────────────────
// One JSON blob per session (week+day). Write the whole blob on every save.
// This means one storage.set call per save — minimal, reliable.

const STORE_PREFIX = 'v9';
const _sessions = {}; // in-memory: { 'w2_mon': { 'field': 'value', ... } }

function _skey(w, d) { return `${STORE_PREFIX}:sess:${w}:${d}`; }

async function loadSession(w, d) {
  const k = `${w}_${d}`;
  if(_sessions[k]) return;
  // Try localStorage first (persists across closes), then window.storage
  try {
    const ls = localStorage.getItem(_skey(w, d));
    if(ls) { _sessions[k] = JSON.parse(ls); return; }
  } catch(e) {}
  try {
    const r = await window.storage.get(_skey(w, d));
    _sessions[k] = (r && r.value) ? JSON.parse(r.value) : {};
  } catch(e) { _sessions[k] = {}; }
}

async function saveSession(w, d) {
  const k = `${w}_${d}`;
  const json = JSON.stringify(_sessions[k] || {});
  // Write to both — localStorage persists across app closes, window.storage within session
  try { localStorage.setItem(_skey(w, d), json); } catch(e) {}
  try { await window.storage.set(_skey(w, d), json); } catch(e) {}
}

async function getField(w, d, field) {
  await loadSession(w, d);
  return _sessions[`${w}_${d}`][field] || '';
}

async function setField(w, d, field, val) {
  await loadSession(w, d);
  _sessions[`${w}_${d}`][field] = String(val);
  await saveSession(w, d);
}

// Global storage (working weights, carried reps — shared across weeks)
const _global = {};
async function loadGlobal() {
  if(_global._loaded) return;
  // Try localStorage first
  try {
    const ls = localStorage.getItem(`${STORE_PREFIX}:global`);
    if(ls) { Object.assign(_global, JSON.parse(ls)); _global._loaded = true; return; }
  } catch(e) {}
  try {
    const r = await window.storage.get(`${STORE_PREFIX}:global`);
    const data = (r && r.value) ? JSON.parse(r.value) : {};
    Object.assign(_global, data);
  } catch(e) {}
  _global._loaded = true;
}
async function saveGlobal() {
  const data = Object.assign({}, _global);
  delete data._loaded;
  const json = JSON.stringify(data);
  try { localStorage.setItem(`${STORE_PREFIX}:global`, json); } catch(e) {}
  try { await window.storage.set(`${STORE_PREFIX}:global`, json); } catch(e) {}
}
async function getGlobal(key) { await loadGlobal(); return _global[key] || ''; }
async function setGlobal(key, val) { await loadGlobal(); _global[key] = String(val); await saveGlobal(); }

// ── APP STATE ─────────────────────────────────────────────────────────────────
let W = 0; // current week
let D = null; // current day
let VIEW = 'session'; // 'session' | 'progress'

// Per-exercise set tracking (which set is next)
const setNext = {}; // { exName: nextSetIndex }

// ── TIMER ─────────────────────────────────────────────────────────────────────
let timerInt = null, timerSecs = 0, timerOn = false;

function startTimer(secs) {
  ['t90','t120','t150'].forEach(id => document.getElementById(id)?.classList.remove('on'));
  const m = {90:'t90',120:'t120',150:'t150'};
  if(m[secs]) document.getElementById(m[secs])?.classList.add('on');
  if(timerInt) { clearInterval(timerInt); timerInt=null; }
  timerSecs=secs; timerOn=true; renderTimer();
  timerInt = setInterval(()=>{ timerSecs--; renderTimer(); if(timerSecs<=0){clearInterval(timerInt);timerInt=null;timerOn=false;} },1000);
}
function stopTimer() {
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  timerOn=false; timerSecs=0;
  const el=document.getElementById('timerDisp');
  if(el){el.textContent='—';el.className='timer-disp';}
  ['t90','t120','t150'].forEach(id=>document.getElementById(id)?.classList.remove('on'));
}
function renderTimer() {
  const el=document.getElementById('timerDisp');
  if(!el) return;
  const m=Math.floor(Math.abs(timerSecs)/60), s=Math.abs(timerSecs)%60;
  el.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  el.className='timer-disp'+(timerOn&&timerSecs>15?' run':timerSecs>0&&timerSecs<=15?' warn':'');
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
async function changeWeek(dir) {
  const n=W+dir;
  if(n<0||n>=WEEKS.length) return;
  W=n; D=null; VIEW='session';
  renderHeader(); await renderTabs(); renderMain();
}
async function selectDay(day) { D=day; VIEW='session'; await renderTabs(); renderMain(); }
function switchView(v) { VIEW=v; renderMain(); }

// ── RENDER HEADER ─────────────────────────────────────────────────────────────
function renderHeader() {
  document.getElementById('weekTitle').textContent=WEEKS[W].label;
  document.getElementById('weekDates').textContent=WEEKS[W].dates;
  document.getElementById('prevBtn').disabled=W===0;
  document.getElementById('nextBtn').disabled=W>=WEEKS.length-1;
}

async function renderTabs() {
  const days=getDays(W);
  const labels={'mon':'Mon Pull','tue':'Tue','wed':'Wed Push','thu-a':'Thu A','thu-b':'Thu B — Core','fri':'Fri'};
  if(W===0) { labels['wed']='Wed — Pull'; labels['thu-a']='Thu — Push'; }
  let html='';
  for(const d of days) {
    const done = await getField(W, d, 'logged');
    const active = D===d;
    html+=`<button class="day-tab ${active?'active':''} ${done&&!active?'done':''}" onclick="selectDay('${d}')">${labels[d]}</button>`;
  }
  document.getElementById('dayTabs').innerHTML=html;
}

// ── RENDER MAIN ───────────────────────────────────────────────────────────────
async function renderMain() {
  const main=document.getElementById('main');
  updateTimerVisibility();
  if(!D) { await renderOverview(main); return; }

  // Week 0 session remapping
  let sessKey=D;
  if(W===0) { if(D==='wed') sessKey='mon'; else if(D==='thu-a') sessKey='wed'; }
  const sess=SESSIONS[sessKey];
  if(!sess){main.innerHTML='';return;}

  // Run-only days
  if(sess.runOnly) { await renderRunOnly(main, sess); return; }

  // Combined run+lift days
  VIEW==='progress' ? await renderProgress(main) : await renderSession(main, sess, sessKey);
}

function updateTimerVisibility() {
  const timerEl = document.querySelector('.float-timer');
  if(!timerEl) return;
  // Show timer only on lift days with actual sets (not run-only days, not week overview, not progress view)
  const showTimer = D && D!=='tue' && D!=='fri' && VIEW==='session';
  timerEl.classList.toggle('hidden', !showTimer);
}

// Checkpoint week indices — used for countdown and progress calculations
const CHECKPOINT_WEEKS = WEEKS.map((w,i)=>w.phase==='checkpoint'?i:null).filter(i=>i!==null);

function nextCheckpoint(fromWeek) {
  for(const cw of CHECKPOINT_WEEKS) if(cw >= fromWeek) return cw;
  return null;
}

const DAY_ICONS = {'mon':'💪','tue':'🏃','wed':'🏃','thu-a':'⚡','thu-b':'🏃','fri':'🏃'};

async function renderOverview(main) {
  const p=WEEKS[W];
  const isCP=p.phase==='checkpoint';
  const isRec=p.phase==='recovery';
  let html='';

  if(isCP) {
    html+=`<div class="cp-banner"><div class="cp-tag">Checkpoint</div><div class="cp-icon">🎯</div><div><div class="cp-title">${p.note.split(' — ')[0]}</div><div class="cp-sub">${p.note.split(' — ').slice(1).join(' — ')}</div></div></div>`;
  }
  if(isRec && W===0) {
    html+=`<div class="rec-banner"><div class="cp-icon">🦵</div><div><div class="cp-title" style="color:#7A9BB0">Post-Race Recovery</div><div class="cp-sub">${p.note}</div></div></div>`;
  }

  // ── DASHBOARD ──
  const totalWeeks = WEEKS.length;
  const blockPct = Math.round(((W+1)/totalWeeks)*100);

  const days=getDays(W);
  let doneCount=0;
  for(const d of days) if(await getField(W,d,'logged')) doneCount++;
  const weekPct = days.length ? Math.round((doneCount/days.length)*100) : 0;

  const nextCP = nextCheckpoint(W);
  const weeksToGo = nextCP!==null ? nextCP - W : null;
  const cpText = nextCP===null ? '—' : weeksToGo===0 ? 'This week' : `${weeksToGo}`;
  const cpSub = nextCP===null ? 'Block complete' : weeksToGo===0 ? WEEKS[nextCP].label.split(' — ')[1]||'' : `week${weeksToGo===1?'':'s'} away`;

  html+=`<div class="dash-card">
    <div class="dash-row">
      <div class="dash-block-progress">
        <div class="dash-label">Winter Block Progress</div>
        <div class="dash-value">Week ${W+1} of ${totalWeeks}</div>
        <div class="block-bar-track"><div class="block-bar-fill" style="width:${blockPct}%"></div></div>
      </div>
    </div>
    <div class="dash-split">
      <div class="dash-mini">
        <div class="dash-mini-label">This Week</div>
        <div class="dash-ring-wrap">${buildRing(weekPct)}<div class="dash-ring-num">${doneCount}/${days.length}</div></div>
        <div class="dash-mini-sub">days logged</div>
      </div>
      <div class="dash-mini">
        <div class="dash-mini-label">Next Checkpoint</div>
        <div class="cp-countdown-num">${cpText}</div>
        <div class="cp-countdown-label">${cpSub}</div>
      </div>
    </div>
  </div>`;

  if(p.note && !isCP && !isRec) {
    html+=`<div class="sess-hdr"><div class="sess-title">${p.label}</div><div class="sess-meta">${p.dates}</div><div class="sess-goal">${p.note}</div></div>`;
  }

  html+=`<button class="export-btn" onclick="runExport()">Export All Data</button><div id="exportOut"></div>`;

  // ── DAY LIST ──
  const dNames={'mon':'Monday','tue':'Tuesday','wed':'Wednesday','thu-a':'Thursday (Type A)','thu-b':'Thursday (Type B)','fri':'Friday'};
  const dFocus={'mon':'Pull lift','tue':'Threshold run','wed':'Run + Push lift','thu-a':'Short run + Full lift','thu-b':'Long run + Core only','fri':'Easy long run'};
  const dFocus0={'wed':'Pull lift — no run','thu-a':'Push lift — no run','fri':'Easy jog 30 min'};

  const todayKey = getTodayKey();

  html+=`<div class="overview"><div class="overview-title">This Week</div>`;
  for(const d of days) {
    const done=await getField(W,d,'logged');
    const focus=W===0?(dFocus0[d]||dFocus[d]):dFocus[d];
    const isToday = todayKey===d;
    html+=`<div class="ov-day-row ${isToday?'today':''}" onclick="selectDay('${d}')">
      <div class="ov-day-icon ${done?'complete':''}">${done?'✓':DAY_ICONS[d]||'○'}</div>
      <div class="ov-day-info"><div class="ov-day-name">${dNames[d]}</div><div class="ov-day-focus2">${focus}</div></div>
      <div class="ov-day-chevron">›</div>
    </div>`;
  }
  html+=`</div>`;
  main.innerHTML=html;
}

function buildRing(pct) {
  const r=24, c=2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return `<svg width="56" height="56" style="position:absolute;inset:0;transform:rotate(-90deg)">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="#0D1B2A" stroke-width="5"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="#00C2A8" stroke-width="5" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

async function isSessionComplete(sess) {
  // Check all lift exercises have all sets done
  if(sess.blocks) {
    for(const block of sess.blocks) {
      if(block.warmup) continue;
      for(const ex of block.exs) {
        for(let si=0; si<ex.sets.length; si++) {
          const done = await getField(W,D,`${ex.name}:${si}:done`);
          if(!done) return false;
        }
      }
    }
  }
  // If this day has a run component, it must be marked done too
  if((D==='wed'||D==='thu-a'||D==='thu-b') && W>0) {
    const runDone = await getField(W,D,'rundone');
    if(!runDone) return false;
  }
  // Must have at least one exercise to be "complete" (avoid false positive on empty blocks)
  const hasAnyExercise = sess.blocks && sess.blocks.some(b=>!b.warmup && b.exs.length>0);
  return hasAnyExercise;
}

function getTodayKey() {
  const today=new Date();
  const weekStarts=[
    new Date('2026-10-19'),new Date('2026-10-26'),
    new Date('2026-11-02'),new Date('2026-11-09'),new Date('2026-11-16'),new Date('2026-11-23'),
    new Date('2026-11-30'),new Date('2026-12-07'),new Date('2026-12-14'),new Date('2026-12-21'),
    new Date('2026-12-28'),new Date('2027-01-04'),new Date('2027-01-11'),new Date('2027-01-18'),
  ];
  if(W<0||W>=weekStarts.length) return null;
  const monday=weekStarts[W];
  const friday=new Date(monday); friday.setDate(friday.getDate()+4); friday.setHours(23,59,59);
  if(today<monday||today>friday) return null;
  const dow=today.getDay();
  const rel=W-2; const thuType=(rel>=0&&rel%2===0)?'thu-a':'thu-b';
  const dowMap={1:'mon',2:'tue',3:'wed',4:thuType,5:'fri'};
  return dowMap[dow]||null;
}

async function renderSession(main, sess, sessKey) {
  const p=WEEKS[W];
  const isCP=p.phase==='checkpoint';
  let html='';

  html+=`<div class="view-toggle"><button class="view-btn ${VIEW==='session'?'active':''}" onclick="switchView('session')">Session</button><button class="view-btn ${VIEW==='progress'?'active':''}" onclick="switchView('progress')">Progress</button></div>`;

  if(isCP) html+=`<div class="cp-banner"><div class="cp-tag">Checkpoint</div><div class="cp-icon">🎯</div><div><div class="cp-title">Push for Max Reps on Marker Movements</div><div class="cp-sub">${p.note}</div></div></div>`;
  if(W===0) html+=`<div class="rec-banner"><div class="cp-icon">🦵</div><div><div class="cp-title" style="color:#7A9BB0">Post-Race Recovery — Upper Body Only</div><div class="cp-sub">No running today. Lift only.</div></div></div>`;

  const dayFullyComplete = await isSessionComplete(sess);
  if(dayFullyComplete) {
    html+=`<div class="day-complete-banner"><div class="day-complete-icon">🎉</div><div><div class="day-complete-title">Session Complete</div><div class="day-complete-sub">Every set logged. Nice work.</div></div></div>`;
  }

  html+=`<div class="sess-hdr"><div class="sess-title">${sess.title}</div><div class="sess-meta">${sess.time}</div><div class="sess-goal">${sess.goal}</div></div>`;

  // Run block for combined days (not week 0)
  if((D==='wed'||D==='thu-a'||D==='thu-b') && W>0) {
    html += await buildRunBlock(sess);
  }

  // Lift blocks
  for(const block of sess.blocks) {
    html+=`<div class="block"><div class="block-hdr"><span class="block-tag">${block.label}</span><span class="block-name">${block.name}</span></div>`;
    if(block.warmup) {
      html+=`<div class="warmup-strip"><strong>Do first:</strong> ${block.warmupText}</div>`;
    } else {
      let i=0;
      while(i<block.exs.length) {
        const ex=block.exs[i];
        if(ex.supersetWith && block.exs[i+1]) {
          const ex2=block.exs[i+1];
          const restLabel=ex.rest>=120?`${ex.rest/60} min`:`${ex.rest} sec`;
          html+=`<div class="superset-wrap"><div class="superset-hdr"><span class="superset-lbl">⚡ Superset</span><span class="superset-rest">Rest ${restLabel} after both</span></div>`;
          html+=`<div class="superset-ex">${await buildExCard(ex, true)}</div>`;
          html+=`<div class="superset-arrow">↓ &nbsp; NO REST &nbsp; ↓</div>`;
          html+=`<div class="superset-ex">${await buildExCard(ex2, true)}</div>`;
          html+=`<div class="superset-ftr">Both = 1 round · Rest ${restLabel} · Repeat</div></div>`;
          i+=2;
        } else {
          html+=await buildExCard(ex, false);
          i++;
        }
      }
    }
    html+=`</div>`;
  }

  const notes=await getField(W,D,'notes');
  html+=`<div class="notes-section"><div class="notes-lbl">Session Notes</div><textarea class="notes-input" id="sessNotes" placeholder="Form observations, how it felt..." rows="3">${notes}</textarea></div>`;
  html+=`<button class="done-btn" onclick="saveNotes()" style="background:#243B52;color:#00C2A8;border:1px solid #007A6A;">Save Notes</button>`;
  html+=`<div class="save-bar" id="saveBar"></div>`;
  html+=`<button class="reset-btn" onclick="resetSession(this)">Reset This Session</button>`;

  main.innerHTML=html;
}

async function buildRunBlock(sess) {
  const rp=sess.runPrescriptions?.find(p=>p.w===W)||sess.runPrescriptions?.[sess.runPrescriptions?.length-1];
  const hr=sess.hasHR?await getField(W,D,'hr'):'';
  const runDone=await getField(W,D,'rundone');
  let html=`<div class="run-card"><div class="run-top"><span class="run-badge">RUN</span><span class="run-title">Run First — Then Lift</span></div>`;
  html+=`<div class="run-presc">${rp?.text||'See plan'}</div>`;
  if(sess.hasHR) {
    html+=`<div class="run-fields"><div class="run-field-row"><span class="run-field-lbl">Max HR</span><input class="run-input" type="text" inputmode="numeric" id="runHR" value="${hr}" placeholder="—"><span class="run-unit">bpm</span></div></div>`;
  }
  html+=`<button class="run-done-btn ${runDone?'complete':''}" onclick="markRunDone()">${runDone?'✓ Run done':'Complete Run'}</button></div>`;
  return html;
}

async function buildExCard(ex, inSuperset) {
  const ek=ex.name.replace(/\W/g,'_').slice(0,20);
  const cardStyle=inSuperset?'border:none;border-radius:0;margin-bottom:0;':'';

  // Recompute setNext for THIS session (week+day) from actual saved done-flags —
  // don't trust any stale in-memory value carried over from a different week/day
  {
    let realNext = 0;
    for(let chk=0; chk<ex.sets.length; chk++) {
      const d = await getField(W,D,`${ex.name}:${chk}:done`);
      if(d) realNext = chk+1; else break;
    }
    setNext[ex.name] = realNext;
  }

  let html=`<div class="ex-card ${ex.marker?'marker':''}" style="${cardStyle}">`;
  html+=`<div class="ex-top">`;
  html+=`<div class="ex-name-row"><span class="ex-name">${ex.name}</span>`;
  if(ex.marker) html+=`<span class="badge-marker">MARKER</span>`;
  if(ex.compound) html+=`<span class="badge-compound">COMPOUND</span>`;
  html+=`</div>`;
  html+=`<div class="ex-presc">${ex.presc}</div>`;
  html+=`<button class="form-btn" onclick="toggleForm(this)">▸ Form cues</button>`;
  html+=`</div>`;
  html+=`<ul class="form-notes">`;
  for(const n of ex.form) html+=`<li>${n}</li>`;
  html+=`</ul>`;
  if(ex.prog) html+=`<div class="prog-note">→ ${ex.prog}</div>`;

  // Sets
  html+=`<div class="sets-area"><div class="sets-hdr"><div>Set</div><div>${ex.sets[0].w!==null?'Weight':''}</div><div>Reps</div><div>Target</div></div>`;

  for(let si=0;si<ex.sets.length;si++) {
    const set=ex.sets[si];
    // Load saved values
    const wasReset = await getField(W,D,'_wasReset');
    const savedW=set.w!==null ? await getField(W,D,`${ex.name}:${si}:w`) : null;
    const savedR=await getField(W,D,`${ex.name}:${si}:r`);
    const carriedW=(set.w!==null && !wasReset) ? await getGlobal(`work:${ex.name}`) : null;
    const carriedR=wasReset ? '' : await getGlobal(`carried:${ex.name}:${si}`);
    const isDone=await getField(W,D,`${ex.name}:${si}:done`);

    // Display value: saved this session > carried from last session (unless reset) > prescription default
    const dispW=savedW||carriedW||(set.w!==null?String(set.w):'');
    const dispR=savedR||carriedR||set.r;

    const nextIdx=setNext[ex.name]||0;
    const rowClass=isDone?'done':si===nextIdx?'active':'';

    html+=`<div class="set-row ${rowClass}" id="row_${ek}_${si}">`;
    html+=`<div class="set-num" id="chk_${ek}_${si}">${isDone?'✓':si+1}</div>`;
    if(set.w!==null) {
      html+=`<input class="set-input" type="text" inputmode="decimal" id="w_${ek}_${si}" value="${dispW}" placeholder="lbs" onblur="autoSaveSet('${ex.name.replace(/'/g,"\\'")}',${ex.sets.length},${ex.rest},${si})">`;
    } else { html+=`<div></div>`; }
    html+=`<input class="set-input" type="text" inputmode="numeric" id="r_${ek}_${si}" value="${dispR}" placeholder="${set.t||''}" onblur="autoSaveSet('${ex.name.replace(/'/g,"\\'")}',${ex.sets.length},${ex.rest},${si})">`;
    html+=`<div class="set-target">${set.t||set.r}</div>`;
    html+=`</div>`;
  }
  html+=`</div>`;

  // Done button
  const allDone=ex.sets.every(async(set,si)=>await getField(W,D,`${ex.name}:${si}:done`));
  const nextSet=(setNext[ex.name]||0);
  const isAllDone=nextSet>=ex.sets.length;
  html+=`<button class="done-btn ${isAllDone?'all-done':''}" onclick="markSetDone('${ex.name}',${ex.sets.length},${ex.rest})">${isAllDone?'✓ All sets done':`Set ${nextSet+1} — Done`}</button>`;

  html+=`</div>`;
  return html;
}

async function renderProgress(main) {
  const markers=[];
  const seen=new Set();
  for(const [dk,sess] of Object.entries(SESSIONS)) {
    if(!sess.blocks) continue;
    for(const block of sess.blocks) {
      if(block.warmup) continue;
      for(const ex of block.exs) {
        if(ex.marker&&!seen.has(ex.name)){seen.add(ex.name);markers.push(ex.name);}
      }
    }
  }

  let html=`<div class="view-toggle"><button class="view-btn" onclick="switchView('session')">Session</button><button class="view-btn active" onclick="switchView('progress')">Progress</button></div>`;
  html+=`<div class="progress-section"><div class="progress-title">Marker Movement Progress</div>`;

  for(const name of markers) {
    const entries=[];
    for(let w=0;w<WEEKS.length;w++) {
      const days=getDays(w);
      for(const d of days) {
        const sess=SESSIONS[d];
        if(!sess||!sess.blocks) continue;
        let found=false;
        for(const block of sess.blocks) {
          if(block.warmup) continue;
          for(const ex of block.exs) if(ex.name===name&&ex.marker) found=true;
        }
        if(!found) continue;
        const reps=[];
        for(let si=0;si<4;si++) {
          const r=await getField(w,d,`${name}:${si}:r`);
          if(r && !isNaN(parseInt(r))) reps.push(parseInt(r));
        }
        if(reps.length) entries.push({week:w, weekLabel:WEEKS[w].label, best:Math.max(...reps)});
      }
    }

    html+=`<div class="prog-mov">`;
    if(entries.length===0) {
      html+=`<div class="prog-mov-hdr"><div class="prog-mov-name">⭑ ${name}</div></div><div class="prog-empty">No data yet.</div>`;
    } else {
      // Trend: compare most recent to first
      const first=entries[0].best, latest=entries[entries.length-1].best;
      const delta=latest-first;
      const trendLabel = entries.length<2 ? '' : delta>0 ? `↑ +${delta}` : delta<0 ? `↓ ${delta}` : '— flat';
      const trendClass = delta>0 ? 'up' : 'flat';

      html+=`<div class="prog-mov-hdr"><div class="prog-mov-name">⭑ ${name}</div>${trendLabel?`<div class="prog-mov-trend ${trendClass}">${trendLabel}</div>`:''}</div>`;

      // Bar chart — last 8 data points max, so it stays readable
      const shown = entries.slice(-8);
      const maxVal = Math.max(...shown.map(e=>e.best), 1);
      const bestVal = Math.max(...shown.map(e=>e.best));

      html+=`<div class="prog-bars">`;
      for(const e of shown) {
        const heightPct = Math.max((e.best/maxVal)*100, 6);
        const isBest = e.best===bestVal;
        const shortLabel = e.weekLabel.replace('November','Nov').replace('December','Dec').replace('January','Jan').replace(' — Week ',' W').replace('Post-Race ','PR');
        html+=`<div class="prog-bar-col">
          <div class="prog-bar-val">${e.best}</div>
          <div class="prog-bar ${isBest?'best':''}" style="height:${heightPct}%"></div>
          <div class="prog-bar-wk">${shortLabel}</div>
        </div>`;
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  }
  html+=`</div>`;
  main.innerHTML=html;
}

// Shared completion logic — used by both the Done button and auto-save-on-blur
async function completeSet(exName, totalSets, rest, si) {
  const ek=exName.replace(/\W/g,'_').slice(0,20);

  const wEl=document.getElementById(`w_${ek}_${si}`);
  const rEl=document.getElementById(`r_${ek}_${si}`);
  const wVal=wEl?wEl.value.trim():'';
  const rVal=rEl?rEl.value.trim():'';

  // Nothing entered — nothing to save
  if(!wVal && !rVal) return false;
  // Weight field exists but empty — reps alone isn't enough for a weighted exercise
  if(wEl && !wVal) return false;
  // Reps required always (even bodyweight exercises need a rep count)
  if(!rVal) return false;

  // Save to session storage
  if(wVal) await setField(W,D,`${exName}:${si}:w`,wVal);
  await setField(W,D,`${exName}:${si}:r`,rVal);
  await setField(W,D,`${exName}:${si}:done`,'1');
  await setField(W,D,'_wasReset','');

  // Update global working weight and carried reps
  if(wVal) await setGlobal(`work:${exName}`,wVal);
  await setGlobal(`carried:${exName}:${si}`,rVal);

  await setField(W,D,'logged','1');

  // Update DOM
  const row=document.getElementById(`row_${ek}_${si}`);
  const chk=document.getElementById(`chk_${ek}_${si}`);
  if(row){row.classList.remove('active');row.classList.add('done');}
  if(chk) chk.textContent='✓';

  // Advance setNext only if this was the pending set (avoid going backwards)
  if((setNext[exName]||0) <= si) setNext[exName]=si+1;
  const nextSi=setNext[exName];

  // Update button
  const btn=document.querySelector(`button[onclick="markSetDone('${exName}',${totalSets},${rest})"]`);
  if(btn) {
    if(nextSi>=totalSets){btn.textContent='✓ All sets done';btn.classList.add('all-done');}
    else{btn.textContent=`Set ${nextSi+1} — Done`;btn.classList.remove('all-done');}
  }

  // Highlight next row
  if(nextSi<totalSets){
    const nextRow=document.getElementById(`row_${ek}_${nextSi}`);
    if(nextRow && !nextRow.classList.contains('done')){nextRow.classList.add('active');nextRow.scrollIntoView({behavior:'smooth',block:'nearest'});}
  }

  await renderTabs();
  return true;
}

async function markSetDone(exName, totalSets, rest) {
  const si=setNext[exName]||0;
  if(si>=totalSets) return;
  const saved = await completeSet(exName, totalSets, rest, si);
  if(saved) {
    if(rest>0) startTimer(rest);
    showSaved('✓ Set saved');
  }
}

async function autoSaveSet(exName, totalSets, rest, si) {
  const ek=exName.replace(/\W/g,'_').slice(0,20);
  // Don't re-trigger for sets already marked done — avoids restarting timer on accidental re-focus
  const row=document.getElementById(`row_${ek}_${si}`);
  if(row && row.classList.contains('done')) {
    // Still save any edits without restarting timer or advancing
    const wEl=document.getElementById(`w_${ek}_${si}`);
    const rEl=document.getElementById(`r_${ek}_${si}`);
    const wVal=wEl?wEl.value.trim():'';
    const rVal=rEl?rEl.value.trim():'';
    if(wVal) { await setField(W,D,`${exName}:${si}:w`,wVal); await setGlobal(`work:${exName}`,wVal); }
    if(rVal) { await setField(W,D,`${exName}:${si}:r`,rVal); await setGlobal(`carried:${exName}:${si}`,rVal); }
    if(wVal||rVal) showSaved('✓ Updated');
    return;
  }
  const saved = await completeSet(exName, totalSets, rest, si);
  if(saved) {
    if(rest>0) startTimer(rest);
    showSaved('✓ Set saved');
  }
}

async function markRunDone() {
  // Save HR if present
  const hrEl=document.getElementById('runHR');
  if(hrEl&&hrEl.value.trim()) await setField(W,D,'hr',hrEl.value.trim());
  await setField(W,D,'rundone','1');
  await setField(W,D,'logged','1');

  const btn=document.querySelector('.run-done-btn');
  if(btn){btn.textContent='✓ Run done';btn.classList.add('complete');}

  await renderTabs();
  showSaved('✓ Run logged');
}

async function saveNotes() {
  const el=document.getElementById('sessNotes');
  if(!el) return;
  await setField(W,D,'notes',el.value);
  await setField(W,D,'logged','1');
  await renderTabs();
  showSaved('✓ Notes saved');
}

function showSaved(msg='✓ Saved') {
  const el=document.getElementById('saveBar');
  if(!el) return;
  el.textContent=msg;
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.textContent='';},1500);
}

// ── EXPORT ────────────────────────────────────────────────────────────────────
async function runExport() {
  const out=document.getElementById('exportOut');
  if(!out) return;
  out.innerHTML='<div style="color:#7A9BB0;font-size:12px;padding:10px;text-align:center;">Building...</div>';

  const lines=["LIAM O'NEIL — WINTER LIFTING BLOCK EXPORT","==========================================",""];
  const dayLabels={'mon':'Monday Pull','tue':'Tuesday','wed':'Wednesday Push','thu-a':'Thursday A','thu-b':'Thursday B','fri':'Friday'};

  for(let w=0;w<WEEKS.length;w++) {
    const wkLines=[];
    for(const d of getDays(w)) {
      const logged=await getField(w,d,'logged');
      if(!logged) continue;

      let sessKey=d;
      if(w===0){if(d==='wed')sessKey='mon';else if(d==='thu-a')sessKey='wed';}
      const sess=SESSIONS[sessKey];
      wkLines.push(`  ${dayLabels[d]||d}`);

      // Run HR
      const hr=await getField(w,d,'hr');
      if(hr) wkLines.push(`    Max HR: ${hr} bpm`);

      // Lift data
      if(sess&&sess.blocks) {
        for(const block of sess.blocks) {
          if(block.warmup) continue;
          for(const ex of block.exs) {
            const sets=[];
            for(let si=0;si<ex.sets.length;si++) {
              const wv=await getField(w,d,`${ex.name}:${si}:w`);
              const rv=await getField(w,d,`${ex.name}:${si}:r`);
              if(wv) sets.push(`${wv}lbs×${rv||'?'}`);
              else if(rv) sets.push(rv);
            }
            if(sets.length) wkLines.push(`    ${ex.name}${ex.marker?' ★':''}: ${sets.join(' / ')}`);
          }
        }
      }
      const notes=await getField(w,d,'notes');
      if(notes&&notes.trim()) wkLines.push(`    Notes: ${notes.trim().replace(/\n/g,' ')}`);
    }
    if(wkLines.length) {
      lines.push(`${WEEKS[w].label} (${WEEKS[w].dates})`);
      lines.push('------------------------------------------');
      lines.push(...wkLines,'');
    }
  }
  if(lines.length<=3) lines.push('No data logged yet.');
  const text=lines.join('\n');
  window._exportText=text;
  out.innerHTML=`<div class="export-output">${text.replace(/</g,'&lt;')}</div><button class="copy-btn" onclick="doCopy(this)">Copy to Clipboard</button>`;
}

function doCopy(btn) {
  const text=window._exportText||'';
  navigator.clipboard.writeText(text).then(()=>{btn.textContent='✓ Copied — paste into Claude';setTimeout(()=>{btn.textContent='Copy to Clipboard';},2500);}).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    btn.textContent='✓ Copied';setTimeout(()=>{btn.textContent='Copy to Clipboard';},2500);
  });
}

// ── RESET ─────────────────────────────────────────────────────────────────────
async function resetSession(btn) {
  if(btn.dataset.confirm !== '1') {
    btn.dataset.confirm = '1';
    btn.textContent = 'Tap again to confirm';
    btn.classList.add('confirming');
    setTimeout(() => {
      btn.dataset.confirm = '';
      btn.textContent = 'Reset This Session';
      btn.classList.remove('confirming');
    }, 3000);
    return;
  }

  // Clear this session's data completely
  const k = `${W}_${D}`;
  _sessions[k] = { _wasReset: '1' };
  const key = _skey(W, D);
  const json = JSON.stringify(_sessions[k]);
  try { localStorage.setItem(key, json); } catch(e) {}
  try { await window.storage.set(key, json); } catch(e) {}

  // Reset set progress tracking
  Object.keys(setNext).forEach(x => delete setNext[x]);

  // Re-render
  await renderTabs();
  renderMain();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});

  const weekStarts=[
    new Date('2026-10-19'),new Date('2026-10-26'),
    new Date('2026-11-02'),new Date('2026-11-09'),new Date('2026-11-16'),new Date('2026-11-23'),
    new Date('2026-11-30'),new Date('2026-12-07'),new Date('2026-12-14'),new Date('2026-12-21'),
    new Date('2026-12-28'),new Date('2027-01-04'),new Date('2027-01-11'),new Date('2027-01-18'),
  ];

  const today=new Date();
  let todayInPlan=false;
  W=0;
  for(let w=0;w<weekStarts.length;w++) {
    const fri=new Date(weekStarts[w]);fri.setDate(fri.getDate()+4);fri.setHours(23,59,59);
    if(today>=weekStarts[w]&&today<=fri){W=w;todayInPlan=true;break;}
    if(today>fri) W=Math.min(w+1,WEEKS.length-1);
  }

  if(todayInPlan) {
    const dow=today.getDay();
    const rel=W-2;const thuType=(rel>=0&&rel%2===0)?'thu-a':'thu-b';
    const dowMap={1:'mon',2:'tue',3:'wed',4:thuType,5:'fri'};
    const todayKey=dowMap[dow];
    const days=getDays(W);
    if(todayKey&&days.includes(todayKey)) D=todayKey;
  }

  renderHeader();
  await renderTabs();
  renderMain();
}

init();
</script>
